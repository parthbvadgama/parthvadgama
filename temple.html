
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Girnar Five Shikhar</title>

<style>

/* Common CSS */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    overflow-x: hidden;
}

/* Header */

.div1 {
    background-color: #CC66FF;
    padding: 20px;
    width: 100%;
}

.div1 h2 {
    text-align: center;
    font-size: 30px;
    margin-bottom: 15px;
}

.div2 {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding-right: 30px;
}

.div2 a {
    text-decoration: none;
    color: black;
    font-size: 18px;
    font-weight: bold;
}

/* Image Gallery */

.gallery {
    width: 90%;
    max-width: 1200px;
    margin: 30px auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

.tab {
    text-align: center;
    background-color: white;
    padding: 12px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.tab img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 8px;
}

.tab p {
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
}

/* Last Image */

.last-image {
    width: 90%;
    max-width: 1200px;
    margin: 20px auto;
    text-align: center;
}

.last-image img {
    width: 100%;
    height: auto;
    display: block;
    border: 5px solid black;
    border-radius: 5px;
}

/* Tablet Responsive */

@media screen and (max-width: 768px) {

    .div1 h2 {
        font-size: 26px;
    }

    .gallery {
        width: 95%;
        gap: 15px;
    }

    .tab img {
        height: 200px;
    }

    .tab p {
        font-size: 16px;
    }

}

/* Mobile Responsive */

@media screen and (max-width: 480px) {

    .div1 {
        padding: 15px;
    }

    .div1 h2 {
        font-size: 23px;
    }

    .div2 {
        justify-content: center;
        padding-right: 0;
    }

    .div2 a {
        font-size: 16px;
    }

    .gallery {
        width: 92%;
        grid-template-columns: 1fr;
        gap: 20px;
        margin: 20px auto;
    }

    .tab {
        padding: 10px;
    }

    .tab img {
        height: 230px;
    }

    .tab p {
        font-size: 17px;
    }

    .last-image {
        width: 95%;
    }

}

</style>
</head>

<body>

<!-- Header -->

<div class="div1">

    <h2>Girnar Five Shikhar</h2>

    <div class="div2">
        <a href="JND.HTML">HOME</a>
    </div>

</div>

<!-- Gallery -->

<div class="gallery">

    <div class="tab">
        <img src="ambaji_1.jpg" alt="Ambaji Temple">
        <p>Ambaji Temple</p>
    </div>

    <div class="tab">
        <img src="2.jpg" alt="Guru Gorakhnath Peak">
        <p>Guru Gorakhnath Peak</p>
    </div>

    <div class="tab">
        <img src="3.jpg" alt="Oghad Shikhar">
        <p>Oghad Shikhar</p>
    </div>

    <div class="tab">
        <img src="4.jpg" alt="Dattatreya Tirth">
        <p>Shree Guru Dattatreya Tirth</p>
    </div>

    <div class="tab">
        <img src="5.jpg" alt="Girnar Mount">
        <p>Girnar Mount</p>
    </div>

</div>
</body>
</html>
