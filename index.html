
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Junagadh Tourism</title>

<style>

/* Common CSS */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #FF3366;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* Header */

.header {
    background-color: #FF0099;
    border-radius: 100px;
    padding: 20px;
    width: 100%;
}

.div2 {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    flex-wrap: wrap;
}

.div2 select {
    padding: 10px;
    font-size: 16px;
    border-radius: 8px;
}

.div2 a {
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
}

/* Banner */

.banner {
    position: relative;
    width: 100%;
    height: 500px;
    overflow: hidden;
}

.banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.banner-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
    width: 90%;
}

.banner-text h1 {
    font-size: 50px;
}

.banner-text p {
    font-size: 22px;
    margin-top: 15px;
}

/* Video Section */

.video-section {
    text-align: center;
    padding: 50px 20px;
    background: #f5f5f5;
}

.video-section h2 {
    font-size: 35px;
    color: #222;
}

.video-container {
    width: 90%;
    max-width: 1000px;
    aspect-ratio: 16 / 9;
    margin: 30px auto;
}

.video-container video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 15px;
}

/* Map Section */

.map-section {
    text-align: center;
    padding: 40px 20px;
    background-color: white;
}

.map-section h2 {
    font-size: 35px;
    margin-bottom: 15px;
}

.map-section p {
    font-size: 18px;
    margin-bottom: 20px;
}

.map-container {
    width: 90%;
    max-width: 1100px;
    margin: auto;
}

.map-container iframe {
    width: 100%;
    height: 450px;
    border: 0;
    border-radius: 15px;
}

/* Tablet Responsive */

@media screen and (max-width: 768px) {

    .header {
        border-radius: 20px;
        padding: 15px;
    }

    .div2 {
        gap: 15px;
    }

    .banner {
        height: 350px;
    }

    .banner-text h1 {
        font-size: 35px;
    }

    .banner-text p {
        font-size: 18px;
    }

    .video-section h2,
    .map-section h2 {
        font-size: 28px;
    }

    .map-container iframe {
        height: 350px;
    }

}

/* Mobile Responsive */

@media screen and (max-width: 480px) {

    .header {
        border-radius: 15px;
        padding: 12px;
    }

    .div2 {
        flex-direction: column;
        gap: 15px;
    }

    .div2 select {
        width: 100%;
        max-width: 250px;
    }

    .div2 a {
        font-size: 16px;
    }

    .banner {
        height: 250px;
    }

    .banner-text h1 {
        font-size: 27px;
    }

    .banner-text p {
        font-size: 15px;
    }

    .video-section {
        padding: 30px 10px;
    }

    .video-section h2,
    .map-section h2 {
        font-size: 24px;
    }

    .video-container {
        width: 100%;
        margin: 20px auto;
    }

    .map-section {
        padding: 30px 10px;
    }

    .map-section p {
        font-size: 15px;
    }

    .map-container {
        width: 100%;
    }

    .map-container iframe {
        height: 300px;
    }

}
	
</style>
</head>

<body>

</div>
