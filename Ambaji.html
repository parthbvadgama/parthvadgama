<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shree Arasuri Amba Mataji Temple, Ambaji</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFCC99;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .heading {
            text-align: center;
            font-size: 35px;
            font-weight: bold;
            color: #8B0000;
            padding: 25px 10px;
        }

        .image-section {
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        .image-section img {
            width: 494px;
            max-width: 100%;
            height: 420px;
            object-fit: cover;
            border-radius: 15px;
            display: block;
            margin: auto;
        }

        /* Tablet */
        @media screen and (max-width: 768px) {

            .heading {
                font-size: 30px;
            }

            .image-section {
                padding: 15px;
            }

            .image-section img {
                width: 90%;
                height: 350px;
            }
        }

        /* Mobile */
        @media screen and (max-width: 480px) {

            .heading {
                font-size: 23px;
                padding: 20px 10px;
            }

            .image-section {
                padding: 10px;
            }

            .image-section img {
                width: 100%;
                height: 280px;
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="heading">
        Shree Arasuri Amba Mataji Temple, Ambaji
    </div>

    <div class="image-section">
        <img src="Shree Arasuri Amba Mataji Temple, Ambaji.jpg"
             alt="Shree Arasuri Amba Mataji Temple, Ambaji">
    </div>

</body>
</html>
