<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shri Guru Gorakshnath Mandir - Girnar</title>

<style>

/* Basic CSS */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #FFCC99;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* Heading */

.heading {
    text-align: center;
    font-size: 35px;
    font-weight: bold;
    color: #8B0000;
    padding: 25px 10px;
}

/* Image Section */

.image-section {
    width: 100%;
    text-align: center;
    padding: 20px;
}

.image-section img {
    width: 494px;
    max-width: 100%;
    height: 420px;
    object-fit: cover;
    border-radius: 15px;
}

/* Tablet */

@media screen and (max-width: 768px) {

    .heading {
        font-size: 30px;
    }

    .image-section img {
        width: 90%;
        height: 350px;
    }

}

/* Mobile */

@media screen and (max-width: 480px) {

    .heading {
        font-size: 22px;
        padding: 20px 10px;
    }

    .image-section {
        padding: 10px;
    }

    .image-section img {
        width: 100%;
        height: 280px;
        object-fit: cover;
        border-radius: 10px;
    }

}

</style>

</head>

<body>

<!-- Heading -->

<div class="heading">
    Shri Guru Gorakshnath Mandir (Shiv Goraksh), Girnar
</div>

<!-- Image -->

<div class="image-section">

    <img src="Shri Guru Gorakshnath Mandir (Shiv Goraksh) , Girnar.jpg"
         alt="Shri Guru Gorakshnath Mandir Girnar">

</div>

</body>
</html>
